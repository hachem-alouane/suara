<div class="relative">
  <div class="grid ">
    <div class="modal-body flex flex-column justify-content-center align-items-center ">
      <div class=" flex w-full flex-column gap-3  w-full justify-content-center align-items-center ">
        <div class="flex justify-content-between w-11">
          <app-basic-table #table [columns]="columnsViewMode" [loading]="loading" class="w-full">
          </app-basic-table>
        </div>
      </div>
      <div class=" footer-set-element flex gap-3 w-full justify-content-end ">
        <app-button (clickEv)="cancel()" size="small"
          styleClass=" p-button  surface-400 hover:surface-600 border-none border-round-sm ">
          {{"CLOSE" | translate }}
        </app-button>
      </div>
    </div>
  </div>
</div>
