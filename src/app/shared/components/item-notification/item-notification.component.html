<app-link-button [text]="true" class="flex justify-content-between w-full
hover:bg-primary-100 transition-colors  duration-200 rounded-lg p-1
" [routerLink]="notification?.link ?? ''" (clickEv)="notificationClick.emit(true)">
  <div class="flex w-8 flex-column hover:text-blue-800  text-black-alpha-80">
    <div class=" text-base font-bold flex gap-2 align-items-center">
      <div class=" ">
        {{notification?.title}}
      </div>
    </div>
    <div class="text text-sm text-gray-600 hover:text-gray-600">{{notification?.message}}</div>
  </div>
  <div class="flex w-3 text-gray-400 text-sm ">
    <div>{{notification?.createdAt! | dynamicDate: 'd MMM y ,HH:mm:ss' }}</div>

  </div>
</app-link-button>
