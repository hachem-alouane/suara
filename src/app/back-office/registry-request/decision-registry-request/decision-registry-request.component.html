<div class="relative">
  <div class="grid ">
    <div class="modal-body flex flex-column justify-content-center align-items-center ">
      <form class="flex flex-column justify-content-center h-full   mt-3 form-dialogue-one-raw" appFocusInvalidInput
        [formGroup]="myForm" (ngSubmit)="register()">
        <div class=" flex  flex-column gap-3  w-full justify-content-center align-items-center ">
          <div class="flex justify-content-between gap-5  w-10">
            <app-dropdown class="w-full" [label]="'DECISIONN'" [placeholder]="'DECISIONN'"
              [controlName]="'decsionformcontrol'" [listValues]="ListOfDecisions" [isRequired]="true"
              [optionLabel]="'name'" [optionValue]="'value'"></app-dropdown>
          </div>
          @if (myForm.get('decsionformcontrol')?.value ==="CI") {
          <div class="flex justify-content-between gap-5  w-10">
            <app-textarea class="w-full" [controlName]="'description'" [isRequired]="true" [maxLength]="30000"
              [label]="'MESSAGE'" placeholder="MESSAGE">
              <ng-container labelPrefix> : </ng-container>
            </app-textarea>
          </div>
          }

        </div>
        <div class=" footer-set-element flex gap-3 w-full justify-content-end ">
          <app-button (clickEv)="cancel()" size="small"
            styleClass=" p-button  surface-400 hover:surface-600 border-none border-round-sm ">
            {{"CLOSE" | translate }}
          </app-button>
          <app-button size="small" type="submit" [loading]="loading" styleClass=" p-button  border-round-sm">
            {{"CONFIRM_REQUEST" | translate }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
</div>
