<div class="parent-wrapper  flex flex-column  mx-3 ">
  <div class=" mb-5">
    <div class="flex gap-3 align-items-center">
      <svg-icon src=" assets/svgs/setting.svg" svgClass="w-full h-full  secondary-color "></svg-icon>
      <div class="text-3xl font-bold  secondary-color mb-3 ">
        {{"USERS" | translate}}</div>
    </div>
    @if (canCreateMode) {
    <app-button styleClass="my-2" [size]="'small'" (clickEv)="showAddPoppup()"> {{"ADD_USER"| translate}} </app-button>
    }

    <form [formGroup]="myForm">
      <div class="filters flex w-full flex-wrap gap-3 align-items-center justify-content-between ">
        <app-input [controlName]="'search'" [placeholder]="'TYPE_TO_SEARCH'" [maxLength]="10000" styleClass=" w-full"
          class="lg:w-7  w-full"></app-input>
        <app-dropdown class="lg:w-4  w-full" styleClass="w-full" [placeholder]="'STATUS'" [controlName]="'filterStatus'"
          [listValues]="listOfStatus" [optionLabel]="'name'" [optionValue]="'value'"></app-dropdown>
      </div>
    </form>

    <app-table #table (blockEv)="blockUser($event)" (enableEv)="enableUser($event)" [showAddBtn]="false"
      [columns]="columns" [actions]="actionsTable"
      [searchHighlightColumns]="['firstName','lastName','lieu','email','numeroTelephone']"
      (updateEv)="showEditPoppup($event)" (permissionEv)="showPermissionPoppup($event)">
    </app-table>
  </div>
</div>
