<div class="parent-wrapper flex flex-column mx-3 my-4 ">
  <div class="flex gap-2 align-items-center">
    <div style="width: 20px;height: 19px;" class="flex align-items-center">
      <svg-icon src=" assets/svgs/message.svg" svgClass="w-full h-full flex  text-primary  "></svg-icon>
    </div>
    <div class=" font-bold  text-2xl text-primary ">
      {{"WRITE_MESSAGE" | translate}}
    </div>
  </div>
  <form class="flex flex-column justify-content-center h-full " appFocusInvalidInput [formGroup]="myForm"
    (ngSubmit)="sendMail()">
    <div class=" flex  flex-column gap-3  w-full justify-content-center align-items-center ">

      <div class="flex w-full">
        <app-input-chips [controlName]="'sender'" [label]="'RECIPIENTS'" class="w-full" [placeholder]="'RECIPIENTS'">
        </app-input-chips>
      </div>
      <div class="flex w-full">
        <app-multiple-select class="w-full" [placeholder]="'MEMBERS'" [label]="'MEMBERS'" [controlName]="'members'"
          [listValues]="$any(members$ | async)" [optionLabel]="'nom'" [filter]="true" [filterBy]="'nom'"
          [columnsViewMode]="columnsMember" [dataViewMode]="dataMembersView"></app-multiple-select>
      </div>
      <div class="flex w-full">
        <app-multiple-select class="w-full" [placeholder]="'GROUPS'" [label]="'GROUPS'" [controlName]="'groups'"
          [listValues]="$any(groups$ | async)" [optionLabel]="'lib'" [filter]="true" [filterBy]="'lib'"
          [columnsViewMode]="columnsGroups" [dataViewMode]="dataGroupsMemberView"></app-multiple-select>
      </div>

      <div class="flex w-full">
        <app-input [controlName]="'objet'" [label]="'SUBJECT'" class="w-full" [placeholder]="'SUBJECT'"
          [isRequired]="true" [maxLength]="255">
        </app-input>
      </div>
      <div class="flex w-full">
        <app-textarea class="w-full" [controlName]="'description'" [isRequired]="true" [maxLength]="30000"
          [label]="'CONTENT'" placeholder="CONTENT">
          <ng-container labelPrefix> : </ng-container>
        </app-textarea>
      </div>
      <app-button [text]="true"
        styleClass="flex w-full justify-content-center align-items-center h-17rem bg-white mt-3 cursor-pointer"
        style="  border: 2px dashed rgba(161, 167, 196, 1);" class="w-full" (clickEv)="fileInput.click()">
        <div class="flex gap-2 border-2 border-black-600 border-round py-1 px-4">
          <div> {{"ADD_DOCUMENT" | translate}}</div>
          <svg-icon src="assets/svgs/plus.svg" svgClass="w-full h-full"> </svg-icon>
        </div>
        <input type="file" multiple #fileInput class="text-input" style="display: none;"
          (change)="onFileSelected($event)" />
      </app-button>
      @if (selectedFiles.length) {
      <div class="mt-3 flex-column w-full align-items-center justify-content-center gap-3 gap-3">
        @for (file of selectedFiles; track $index; let i = $index) {
        <div class="flex w-full justify-content-center align-items-center mb-3 ">
          <app-card-piece-jointe-upload (deleteEvent)="deleteFile($event)" (viewFileEvent)="previewFile($event)"
            class="w-full" [file]="file" [index]="i"></app-card-piece-jointe-upload>
        </div>
        }
      </div>
      }
      <div class="flex w-full gap-4 mt-4">
        <app-button [type]="'submit'" [loading]="loading" [size]="'small'" styleClass="bg-color-details ">
          {{"RETURN_TO_SUPERVISOR" |
          translate}}
          <i class="pi pi-check"></i>
        </app-button>
        <app-button (clickEv)="reset() " styleClass="bg-red-500" [size]="'small'"> {{"CANCEL" | translate}}
          <i class="pi pi-times-circle"></i>
        </app-button>
      </div>
    </div>

  </form>
</div>
